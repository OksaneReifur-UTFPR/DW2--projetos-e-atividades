<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Contador com Histórico</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <h1>Contador</h1>

      <p id="valor">0</p>

      <div class="botoes">
        <button id="decrementar">-</button>
        <button id="incrementar">+</button>
        <button id="reset">↺</button>
      </div>

      <h2>Histórico</h2>

      <div id="historico"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
